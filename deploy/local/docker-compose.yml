# Local infrastructure for the enterprise lane (Docker Compose).
#
# Compose provides ONLY dependencies — the application itself still runs via
# ./start.sh (or uvicorn directly) so debugging stays on the host. Point the
# backend at these services through the env vars noted per service below.
#
#   docker compose up -d postgres valkey        # enterprise persistence lane
#   docker compose --profile temporal up -d     # + durable workflow server
#   docker compose --profile observability up -d # + OTel collector sink
#
# Volumes persist under Docker's named volumes; `docker compose down -v` wipes
# them. Credentials below are local-loopback defaults — override before
# exposing any port beyond 127.0.0.1.
name: next-tutor-local

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: tutor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor"]
      interval: 10s
      timeout: 5s
      retries: 5
  # Backend wiring: DATABASE_URL=postgresql://tutor:tutor@localhost:5432/tutor
  # (schema management is `alembic upgrade head` from services/api — startup
  # never runs DDL itself). The CI enterprise lane (backend-enterprise job)
  # runs the same version against the same migration set.

  valkey:
    # Cache/rate-limit/lease tier (ADR-0016): Valkey, BSD-3-Clause. Holds only
    # short-lived operational state — never business truth; flushing the volume
    # loses nothing durable. Cache data is NOT migrated from any Redis server.
    image: valkey/valkey:9.1.2
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - cache-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  # Backend wiring: CACHE_URL=redis://localhost:6379/0 (RESP; optional tier —
  # the process falls back to in-process primitives when unset/unreachable).

  temporal:
    # Durable workflow server (ADR-0013). auto-setup provisions its
    # databases on the postgres service above. Pair it with the worker
    # process: TEMPORAL_ADDRESS=127.0.0.1:7233 + `python worker.py` from
    # services/api (see docs/development/enterprise-infra.md). Pin verified
    # against temporalio 1.33 in the CI temporal lane; revisit together.
    image: temporalio/auto-setup:1.25.2
    profiles: ["temporal"]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: tutor
      POSTGRES_PWD: tutor
      POSTGRES_SEEDS: postgres
    ports:
      - "127.0.0.1:7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  otel-collector:
    # Local trace sink for OTEL_TRACES_ENABLED=1 +
    # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 (observability lane);
    # opt-in profile — plain `docker compose up` skips it.
    image: otel/opentelemetry-collector-contrib:0.116.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

volumes:
  postgres-data:
  cache-data:
