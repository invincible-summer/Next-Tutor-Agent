name: Set up test environment
description: Pinned runtimes, locked dependencies and offline classroom renderer
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: |
          backend/requirements*.txt
          backend/constraints.txt
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: frontend/package.json
    - uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - name: Install backend test dependencies
      shell: bash
      run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt
    - name: Install frontend dependencies
      shell: bash
      working-directory: frontend
      run: pnpm install --frozen-lockfile
    - name: Prepare Chromium and classroom resources
      shell: bash
      working-directory: frontend
      run: |
        pnpm exec playwright install --with-deps chromium
        pnpm build:classroom
