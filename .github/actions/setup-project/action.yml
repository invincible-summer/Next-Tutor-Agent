name: Set up test environment
description: >-
  Pinned runtimes and locked dependencies. Inputs declare what a job actually
  needs: python (default) covers the backend suite, node/playwright/classroom
  add the frontend toolchain, Chromium and offline courseware assets for jobs
  that drive the real renderer or browser.
inputs:
  python:
    description: Install pinned Python and backend test dependencies.
    default: "true"
  node:
    description: Install pnpm + Node and the frontend dependency lock.
    default: "false"
  playwright:
    description: Install Chromium for Playwright (cached) — implies node.
    default: "false"
  classroom:
    description: Build offline classroom renderer assets — implies node.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      if: inputs.python == 'true'
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: |
          services/api/requirements*.txt
          services/api/constraints.txt
    - uses: pnpm/action-setup@v6
      if: inputs.node == 'true' || inputs.playwright == 'true' || inputs.classroom == 'true'
      with:
        package_json_file: apps/web/package.json
    - uses: actions/setup-node@v7
      if: inputs.node == 'true' || inputs.playwright == 'true' || inputs.classroom == 'true'
      with:
        node-version: "22"
        cache: pnpm
        cache-dependency-path: apps/web/pnpm-lock.yaml
    - name: Install backend test dependencies
      if: inputs.python == 'true'
      shell: bash
      run: python -m pip install -r services/api/requirements.txt -r services/api/requirements-test.txt
    - name: Install frontend dependencies
      if: inputs.node == 'true' || inputs.playwright == 'true' || inputs.classroom == 'true'
      shell: bash
      working-directory: apps/web
      run: pnpm install --frozen-lockfile
    - name: Cache Playwright Chromium
      if: inputs.playwright == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
    - name: Prepare Chromium and classroom resources
      if: inputs.playwright == 'true' || inputs.classroom == 'true'
      shell: bash
      working-directory: apps/web
      run: |
        pnpm exec playwright install --with-deps chromium
        pnpm build:classroom
