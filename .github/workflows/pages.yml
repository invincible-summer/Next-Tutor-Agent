name: GitHub Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    # Only the demo pipeline lives here: guards, pnpm check and the full test
    # battery run in the CI workflow on the same push. This job exports the
    # synthetic demo, builds the static site (Next still type-checks during
    # the build) and accepts it on a plain file server before upload.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
        with:
          python: "true"
          node: "true"
          playwright: "true"
          classroom: "true"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Export synthetic demo snapshots
        run: |
          python -m unittest discover -s scripts/demo -p "test_*.py"
          python scripts/demo/export_pages_demo.py
      - name: Enforce demo artifact copyright/size contract
        run: python scripts/repo/check_pages_artifact.py apps/web/public/demo
      - name: Static build with demo data
        working-directory: apps/web
        env:
          NEXT_PUBLIC_DEMO_MODE: "1"
          NEXT_PUBLIC_BASE_PATH: /Next-Tutor-Agent
        run: |
          pnpm build
          pnpm test:pages
      - name: Disable Jekyll processing
        run: touch apps/web/out/.nojekyll
      - name: Enforce built-site size budget
        run: |
          size="$(du -sb apps/web/out | cut -f1)"
          echo "built site size: $size bytes"
          if [ "$size" -gt 104857600 ]; then
            echo "::error::built demo site exceeds the 100 MB hard limit"
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out
      - name: Upload browser evidence
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-browser-report
        with:
          report-name: pages-browser-evidence

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
