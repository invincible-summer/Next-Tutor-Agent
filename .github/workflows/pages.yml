name: GitHub Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Repository hygiene (copyright guard)
        run: python scripts/repo/check_repository_hygiene.py
      - name: Documentation links and layout
        run: python scripts/repo/check_documentation.py
      - uses: ./.github/actions/setup-project
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Export synthetic demo snapshots
        run: |
          python -m unittest discover -s scripts/demo -p "test_*.py"
          python scripts/demo/export_pages_demo.py
      - name: Enforce demo artifact copyright/size contract
        run: python scripts/repo/check_pages_artifact.py apps/web/public/demo
      - name: Frontend checks and static build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_DEMO_MODE: "1"
          NEXT_PUBLIC_BASE_PATH: /Next-Tutor-Agent
        run: |
          pnpm check
          pnpm build
          pnpm exec playwright test --config=playwright.pages.config.ts
      - name: Disable Jekyll processing
        run: touch apps/web/out/.nojekyll
      - name: Enforce built-site size budget
        run: |
          size="$(du -sb apps/web/out | cut -f1)"
          echo "built site size: $size bytes"
          if [ "$size" -gt 104857600 ]; then
            echo "::error::built demo site exceeds the 100 MB hard limit"
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-browser-evidence
          path: apps/web/test-results
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
