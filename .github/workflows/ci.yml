name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  EDU_TEST_KEYLESS: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8124

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Repository safety
        run: python scripts/check_repository_invariants.py
      - name: Backend tests (isolated, BM25)
        working-directory: backend
        run: python -m tests

  frontend:
    name: Frontend and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Typecheck, lint and unit tests
        working-directory: frontend
        run: pnpm check
      - name: Production build
        working-directory: frontend
        run: pnpm build
      - name: Critical browser journeys
        working-directory: frontend
        env:
          E2E_PRODUCTION: "1"
          E2E_FRESH: "1"
          E2E_BACKEND_HOME: ${{ runner.temp }}/tutor-e2e
        run: pnpm test:e2e:ci
      - name: Browser diagnostics
        timeout-minutes: 3
        if: always()
        # A report-upload outage must not change the test/build result.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  result:
    # The single required check in main's branch protection.
    name: CI result
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every core job to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
