name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EDU_TEST_KEYLESS: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8124

jobs:
  repo-hygiene:
    # Copyright/distribution guard: runs first and blocks everything below.
    # The documentation guard's --check-generated leg imports the diagrams
    # catalog builder, so backend runtime dependencies must be installed
    # before the checks (the pip cache keeps this step cheap).
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/api/requirements*.txt
            services/api/constraints.txt
      - name: Install backend runtime dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Scan tracked files and full history
        run: python scripts/repo/check_repository_hygiene.py
      - name: Documentation links and layout
        run: python scripts/repo/check_documentation.py --check-generated

  backend-shards:
    # Enumerates services/api/tests into the shard matrix below. Fails loudly
    # when a new test package is not assigned in scripts/repo/plan_backend_shards.py.
    name: Plan backend shards
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Plan shards
        id: plan
        run: echo "matrix=$(python3 scripts/repo/plan_backend_shards.py)" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (${{ matrix.shard }})
    needs: [repo-hygiene, backend-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Keep sibling shard results visible instead of cancelling them. The
      # planner emits an include-only matrix: one entry (shard/setup/suites)
      # per semantic test domain.
      fail-fast: false
      matrix: ${{ fromJSON(needs.backend-shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
        with:
          node: ${{ matrix.setup == 'full' }}
          playwright: ${{ matrix.setup == 'full' }}
          classroom: ${{ matrix.setup == 'full' }}
      - name: Backend tests (isolated, BM25)
        working-directory: services/api
        env:
          SUITES: ${{ matrix.suites }}
        run: python -m tests $SUITES

  frontend:
    name: Frontend and smoke
    needs: repo-hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
        with:
          node: "true"
          playwright: "true"
          classroom: "true"
      - name: Typecheck, lint and unit tests
        working-directory: apps/web
        run: pnpm check
      - name: Critical browser journeys (production build included)
        working-directory: apps/web
        run: >-
          pnpm test:e2e
          tests/e2e/auth-isolation.spec.ts tests/e2e/textbook-bm25.spec.ts
          tests/e2e/strict-qa.spec.ts tests/e2e/grounded-quiz.spec.ts
          tests/e2e/notes.spec.ts tests/e2e/classroom-workflow.spec.ts
      - name: Browser diagnostics
        timeout-minutes: 3
        if: always()
        # A report-upload outage must not change the test/build result.
        continue-on-error: true
        uses: ./.github/actions/upload-browser-report
        with:
          report-name: smoke-report

  result:
    # The single required check in main's branch protection. The backend
    # matrix expands automatically: every shard leg must succeed.
    name: CI result
    if: always()
    needs: [repo-hygiene, backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every core job to pass
        env:
          HYGIENE_RESULT: ${{ needs.repo-hygiene.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$HYGIENE_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
