name: One-shot design consistency fix

on:
  push:
    branches:
      - chore/reliability-gates-20260913

permissions:
  contents: write

jobs:
  patch-design:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/reliability-gates-20260913
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch exact Supervisor contract sentence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/DESIGN.md")
          old = "| `SUPERVISOR_MODE` | `v2` | `legacy` 走 V1 `chat_turn` 单函数路径；v2 运行时异常也自动回退 legacy，SSE 永不中断 |"
          new = "| `SUPERVISOR_MODE` | `v2` | `legacy` 走 V1 `chat_turn` 单函数路径；v2 运行时异常默认显式返回错误；仅当 `SUPERVISOR_LEGACY_FALLBACK=1` 时回退 legacy |"
          text = path.read_text(encoding="utf-8")
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one stale Supervisor sentence, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          git diff -- docs/DESIGN.md
      - name: Commit doc-only correction
        run: |
          changed="$(git status --short)"
          test "$changed" = " M docs/DESIGN.md" || { echo "unexpected changes: $changed"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DESIGN.md
          git commit -m "docs: align Supervisor fallback contract"
          git push origin HEAD:${GITHUB_REF_NAME}
