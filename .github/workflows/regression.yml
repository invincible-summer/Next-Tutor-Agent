name: Extended regression

on:
  schedule:
    # Monday 02:17 Asia/Singapore; avoid the busy top of the hour.
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

env:
  EDU_TEST_KEYLESS: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8124

jobs:
  vector:
    name: Optional vector backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt
      - name: Install optional vector dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt -r backend/requirements-vector.txt
      - name: Vector and public-artifact regressions
        working-directory: backend
        run: python -m tests tests.test_local_rag tests.test_rag_hybrid

  browser:
    name: Full browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Production build
        working-directory: frontend
        run: pnpm build
      - name: Browser regressions
        working-directory: frontend
        env:
          E2E_PRODUCTION: "1"
          E2E_FRESH: "1"
          E2E_BACKEND_HOME: ${{ runner.temp }}/tutor-regression
        run: pnpm test:e2e
      - name: Browser diagnostics
        timeout-minutes: 3
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: regression-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
