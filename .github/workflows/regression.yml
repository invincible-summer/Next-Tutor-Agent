name: Extended regression

on:
  schedule:
    # Monday 02:17 Asia/Singapore; avoid the busy top of the hour.
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

env:
  EDU_TEST_KEYLESS: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8124

jobs:
  vector:
    name: Optional vector backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
        with:
          python: "true"
          node: "false"
          playwright: "false"
          classroom: "false"
      - name: Install optional vector dependencies
        run: python -m pip install -r services/api/requirements-vector.txt
      - name: Vector and public-artifact regressions
        working-directory: services/api
        run: python -m tests tests.agents.knowledge.test_local_rag tests.agents.knowledge.test_rag_hybrid

  browser:
    name: Full browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
        with:
          node: "true"
          playwright: "true"
          classroom: "true"
      - name: Browser regressions (production build included)
        working-directory: apps/web
        run: pnpm test:e2e
      - name: Browser diagnostics
        timeout-minutes: 3
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-browser-report
        with:
          report-name: regression-report
