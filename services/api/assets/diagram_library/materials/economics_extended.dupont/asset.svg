<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" preserveAspectRatio="xMidYMid meet"><rect x="195" y="31" width="90" height="38" rx="7" fill="#bc9460" stroke="#26364a" stroke-width="1.5" /><text x="240" y="55" fill="#26364a" stroke="none" font-size="14" font-family="sans-serif" text-anchor="middle">ROE</text><rect x="15" y="138.5" width="136" height="51" rx="7" fill="#eef2f6" stroke="#26364a" stroke-width="1.5" /><text x="83" y="169" fill="#26364a" stroke="none" font-size="14" font-family="sans-serif" text-anchor="middle">net margin</text><line x1="240" y1="71" x2="83" y2="137" stroke="#8a99a9" stroke-width="2" stroke-linecap="round" fill="none" /><rect x="172" y="138.5" width="136" height="51" rx="7" fill="#eef2f6" stroke="#26364a" stroke-width="1.5" /><text x="240" y="169" fill="#26364a" stroke="none" font-size="14" font-family="sans-serif" text-anchor="middle">asset turnover</text><line x1="240" y1="71" x2="240" y2="137" stroke="#8a99a9" stroke-width="2" stroke-linecap="round" fill="none" /><rect x="316.98" y="138.5" width="160.04" height="51" rx="7" fill="#eef2f6" stroke="#26364a" stroke-width="1.5" /><text x="397" y="169" fill="#26364a" stroke="none" font-size="14" font-family="sans-serif" text-anchor="middle">equity multiplier</text><line x1="240" y1="71" x2="397" y2="137" stroke="#8a99a9" stroke-width="2" stroke-linecap="round" fill="none" /><text x="83" y="245" fill="#26364a" stroke="none" font-size="12" font-family="sans-serif" text-anchor="middle">profit / sales</text><text x="240" y="245" fill="#26364a" stroke="none" font-size="12" font-family="sans-serif" text-anchor="middle">sales / assets</text><text x="397" y="245" fill="#26364a" stroke="none" font-size="12" font-family="sans-serif" text-anchor="middle">assets / equity</text><text x="240" y="302" fill="#26364a" stroke="none" font-size="12" font-family="sans-serif" text-anchor="middle">ROE = margin × turnover × multiplier</text></svg>
