# Alembic configuration for the enterprise persistence schema.
# The database URL itself never lives here: env.py reads DATABASE_URL (or
# EDU_MIGRATION_DATABASE_URL to override), so the same file serves local
# sqlite smoke runs and production PostgreSQL without secrets in the repo.
#
# Usage (from services/api):
#   DATABASE_URL=postgresql+asyncpg://…  alembic upgrade head
#   DATABASE_URL=postgresql+asyncpg://…  alembic revision --autogenerate -m "…"

[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
# Version table lives in the public schema of the target database.
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
