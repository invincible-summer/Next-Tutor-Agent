<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next Tutor Agent · 项目展示</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #101418; color: #e7ecf2;
         font: 14px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
            padding: 10px 16px; background: rgba(16,20,24,.92); backdrop-filter: blur(6px);
            border-bottom: 1px solid #232a31; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; min-width: 0;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .tag { font-size: 11px; color: #8b97a3; white-space: nowrap; }
  nav button { background: #1b2127; color: #e7ecf2; border: 1px solid #2a323a; border-radius: 6px;
                padding: 4px 12px; font-size: 13px; cursor: pointer; }
  nav button:hover { border-color: #4d8dff; color: #4d8dff; }
  nav input { width: 52px; background: #1b2127; color: #e7ecf2; border: 1px solid #2a323a;
               border-radius: 6px; padding: 4px 6px; font-size: 13px; text-align: center; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
  figure { margin: 0 0 28px; }
  figure img { display: block; width: 100%; height: auto; border-radius: 8px;
                border: 1px solid #232a31; box-shadow: 0 8px 28px rgba(0,0,0,.35); }
  figcaption { text-align: center; font-size: 12px; color: #8b97a3; margin-top: 8px; }
  #progress { position: fixed; left: 0; top: 0; height: 2px; width: 0;
               background: #4d8dff; transition: width .15s; }
  @media print {
    header, #progress { display: none; }
    body { background: #fff; }
    figure img { border: none; box-shadow: none; }
  }
</style>
</head>
<body>
<div id="progress"></div>
<header>
  <h1>Next Tutor Agent · 项目展示</h1>
  <span class="tag">23 页 · PDF 手册</span>
  <nav>
    <button type="button" data-act="prev" aria-label="上一页">‹ 上一页</button>
    <input id="page-jump" type="number" min="1" max="23" value="1" aria-label="页码">
    <button type="button" data-act="next" aria-label="下一页">下一页 ›</button>
  </nav>
</header>
<main id="pages">
<figure data-page="1" id="p1"><img src="pages/p-01.png" alt="第 1 页" loading="lazy" decoding="async"><figcaption>1 / 23</figcaption>
<figure data-page="2" id="p2"><img src="pages/p-02.png" alt="第 2 页" loading="lazy" decoding="async"><figcaption>2 / 23</figcaption>
<figure data-page="3" id="p3"><img src="pages/p-03.png" alt="第 3 页" loading="lazy" decoding="async"><figcaption>3 / 23</figcaption>
<figure data-page="4" id="p4"><img src="pages/p-04.png" alt="第 4 页" loading="lazy" decoding="async"><figcaption>4 / 23</figcaption>
<figure data-page="5" id="p5"><img src="pages/p-05.png" alt="第 5 页" loading="lazy" decoding="async"><figcaption>5 / 23</figcaption>
<figure data-page="6" id="p6"><img src="pages/p-06.png" alt="第 6 页" loading="lazy" decoding="async"><figcaption>6 / 23</figcaption>
<figure data-page="7" id="p7"><img src="pages/p-07.png" alt="第 7 页" loading="lazy" decoding="async"><figcaption>7 / 23</figcaption>
<figure data-page="8" id="p8"><img src="pages/p-08.png" alt="第 8 页" loading="lazy" decoding="async"><figcaption>8 / 23</figcaption>
<figure data-page="9" id="p9"><img src="pages/p-09.png" alt="第 9 页" loading="lazy" decoding="async"><figcaption>9 / 23</figcaption>
<figure data-page="10" id="p10"><img src="pages/p-10.png" alt="第 10 页" loading="lazy" decoding="async"><figcaption>10 / 23</figcaption>
<figure data-page="11" id="p11"><img src="pages/p-11.png" alt="第 11 页" loading="lazy" decoding="async"><figcaption>11 / 23</figcaption>
<figure data-page="12" id="p12"><img src="pages/p-12.png" alt="第 12 页" loading="lazy" decoding="async"><figcaption>12 / 23</figcaption>
<figure data-page="13" id="p13"><img src="pages/p-13.png" alt="第 13 页" loading="lazy" decoding="async"><figcaption>13 / 23</figcaption>
<figure data-page="14" id="p14"><img src="pages/p-14.png" alt="第 14 页" loading="lazy" decoding="async"><figcaption>14 / 23</figcaption>
<figure data-page="15" id="p15"><img src="pages/p-15.png" alt="第 15 页" loading="lazy" decoding="async"><figcaption>15 / 23</figcaption>
<figure data-page="16" id="p16"><img src="pages/p-16.png" alt="第 16 页" loading="lazy" decoding="async"><figcaption>16 / 23</figcaption>
<figure data-page="17" id="p17"><img src="pages/p-17.png" alt="第 17 页" loading="lazy" decoding="async"><figcaption>17 / 23</figcaption>
<figure data-page="18" id="p18"><img src="pages/p-18.png" alt="第 18 页" loading="lazy" decoding="async"><figcaption>18 / 23</figcaption>
<figure data-page="19" id="p19"><img src="pages/p-19.png" alt="第 19 页" loading="lazy" decoding="async"><figcaption>19 / 23</figcaption>
<figure data-page="20" id="p20"><img src="pages/p-20.png" alt="第 20 页" loading="lazy" decoding="async"><figcaption>20 / 23</figcaption>
<figure data-page="21" id="p21"><img src="pages/p-21.png" alt="第 21 页" loading="lazy" decoding="async"><figcaption>21 / 23</figcaption>
<figure data-page="22" id="p22"><img src="pages/p-22.png" alt="第 22 页" loading="lazy" decoding="async"><figcaption>22 / 23</figcaption>
<figure data-page="23" id="p23"><img src="pages/p-23.png" alt="第 23 页" loading="lazy" decoding="async"><figcaption>23 / 23</figcaption>
</main>
<script>
(function () {
  var total = 23;
  var pages = Array.prototype.slice.call(document.querySelectorAll("figure[data-page]"));
  var jump = document.getElementById("page-jump");
  var bar = document.getElementById("progress");
  function goTo(n) {
    n = Math.min(Math.max(n, 1), total);
    var target = pages[n - 1];
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    jump.value = n;
  }
  document.querySelector("nav").addEventListener("click", function (e) {
    var act = e.target.getAttribute && e.target.getAttribute("data-act");
    if (act === "prev") goTo(parseInt(jump.value, 10) - 1);
    if (act === "next") goTo(parseInt(jump.value, 10) + 1);
  });
  jump.addEventListener("change", function () { goTo(parseInt(jump.value, 10) || 1); });
  document.addEventListener("keydown", function (e) {
    if (e.target === jump) return;
    if (e.key === "ArrowLeft" || e.key === "PageUp") goTo(parseInt(jump.value, 10) - 1);
    if (e.key === "ArrowRight" || e.key === "PageDown") goTo(parseInt(jump.value, 10) + 1);
  });
  window.addEventListener("scroll", function () {
    var h = document.documentElement;
    var ratio = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
    bar.style.width = (ratio * 100).toFixed(2) + "%";
    var mid = h.scrollTop + h.clientHeight * 0.4, cur = 1;
    for (var i = 0; i < pages.length; i++) {
      if (pages[i].offsetTop <= mid) cur = i + 1; else break;
    }
    jump.value = cur;
  }, { passive: true });
})();
</script>
</body>
</html>
