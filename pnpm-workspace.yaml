packages:
  - apps/*
  - packages/*

# Isolated installs by default: undeclared dependencies must fail at the
# workspace boundary instead of being masked by hoisting. pnpm 11's
# allowBuilds map makes every dependency build script an explicit decision
# (strict-dep-builds is the v11 default): sharp ships prebuilt binaries we
# want; unrs-resolver needs no build step for this workload.
allowBuilds:
  '@parcel/watcher': true
  sharp: true
  unrs-resolver: false

auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-hp3w-g68c-fv3c

minimumReleaseAgeExclude:
  - '@expo/image-utils@0.11.6'
  - '@expo/require-utils@57.0.6'
  - '@expo/ui@57.0.22'
  - expo-asset@57.0.19
  - expo-constants@57.0.21
  - expo-linking@57.0.12
  - expo-router@57.0.25
  - '@expo/cli@57.0.28'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17'
  - '@expo/router-server@57.0.12'
  - babel-preset-expo@57.0.14
  - expo-modules-autolinking@57.0.14
  - expo-modules-core@57.0.21
  - expo@57.0.27

# Security fixes for transitive CLI/URL utilities; native SDK versions remain pinned.
overrides:
  "uuid@<11.1.1": "11.1.1"
  "decode-uri-component@<0.5.0": "0.5.0"
  "@types/react-dom@>=19.3.0 <20": "19.2.7"
  # KaTeX GHSA-238p-pmpm-9mq7 (trust-restriction bypass, fixed 0.18.2):
  # rehype-katex@7 still pins ^0.16, so force the whole tree to 0.18.11.
  katex: "0.18.11"
